[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harbor-trajectory-extractor"
version = "0.1.0"
description = "Extract Harbor ATIF trajectories and tool-aware training JSONL from agent sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "WTHSBG" }]
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
]

[project.scripts]
harbor-trajectory-extractor = "harbor_trajectory_extractor.cli:main"
htextract = "harbor_trajectory_extractor.cli:main"
htextract-training = "harbor_trajectory_extractor.training_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
